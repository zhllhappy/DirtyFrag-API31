name: Build DirtyFrag API31

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate test keystore
        run: |
          keytool -genkeypair -noprompt \
            -keystore app/keystore.jks \
            -alias dirtyfrag \
            -keyalg RSA -keysize 2048 \
            -validity 3650 \
            -storepass dirtyfrag \
            -keypass dirtyfrag \
            -dname "CN=DirtyFrag API31 Test"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/dirtyfrag.apk
          test -s "$APK"
          MIN_SDK=$(apkanalyzer manifest min-sdk "$APK")
          test "$MIN_SDK" = "31"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DirtyFrag-API31
          path: app/build/outputs/apk/debug/dirtyfrag.apk
          if-no-files-found: error
          retention-days: 14
